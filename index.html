<script>

  {nombre:'Transporte',tipo:'gasto',emoji:'🚕',color:'#EC4899',palabras:'transporte,taxi,uber,didi,bus,metro,pasaje,pasajes,indriver,cabify,parqueadero,peaje,peajes'},

];
// ===== Intérprete de frases (español Colombia) =====
const Parser = (() => {
  const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const UNITS = {un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900};
  const MULT = {mil:1e3,luca:1e3,lucas:1e3,luka:1e3,lukas:1e3,k:1e3,millon:1e6,millones:1e6,palo:1e6,palos:1e6,melon:1e6,melones:1e6};
  const SEP = new Set([',', ';', 'y', 'e', 'tambien', 'ademas', 'luego', 'despues']);
  const MONTHS = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
  const WD = {domingo:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6};
  const INC = /(?:^| )(me pagaron|pagaron|me pago|me consignaron|consignaron|me transfirieron|transfirieron|recibi|ingreso|ingresaron|me entro|me entraron|entraron|cobre|gane|vendi|me abonaron|abonaron|me dieron|honorarios|sueldo|salario|nomina)(?= |$)/;
  const EXP = /(?:^| )(gaste|me gaste|pague|compre|gasto|gastamos|pagamos|compramos|me cobraron)(?= |$)/;
  const VERBS = new Set(['me','gaste','pague','compre','gasto','gastamos','pagamos','compramos','pagaron','pago','consignaron','transfirieron','recibi','ingreso','ingresaron','entro','entraron','cobre','gane','vendi','abonaron','dieron','cobraron']);
  const STOP = new Set(['en','de','del','el','la','los','las','un','una','unos','unas','por','para','pesos','peso','con','al','a','que','se','fue','y','e','mi','mis','lo','le','otro','otra','total','valor','plata','pesitos']);

  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  function todayStr() { return new Intl.DateTimeFormat('en-CA', {timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date()); }
  const addDays = (s, n) => { const d = parseYmd(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); };
  function mkDate(y, m, d) { const dt = new Date(Date.UTC(y, m - 1, d)); return dt.getUTCMonth() === m - 1 ? ymd(dt) : null; }

  // --- 1. Fechas: se reemplazan por marcadores ---
  function extractDates(text, today) {
    const dates = [];
    const T = parseYmd(today), Y = T.getUTCFullYear(), M = T.getUTCMonth() + 1;
    const L = '(?<![\\p{L}\\d])', R = '(?![\\p{L}\\d])';
    const put = d => { if (!d) return ' '; dates.push(d); return ' ⟦D' + (dates.length - 1) + '⟧ '; };
    const rules = [
      [new RegExp(L + '(\\d{1,2})[/-](\\d{1,2})(?:[/-](\\d{2,4}))?' + R, 'giu'), (m, d, mo, y) => {
        let yy = y ? (+y < 100 ? 2000 + +y : +y) : Y; let r = mkDate(yy, +mo, +d);
        if (r && !y && r > today) r = mkDate(yy - 1, +mo, +d); return put(r); }],
      [new RegExp(L + '(?:el\\s+)?(?:d[ií]a\\s+)?(\\d{1,2})\\s+de\\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|sept?iembre|octubre|noviembre|diciembre)(?:\\s+(?:de\\s+|del\\s+)?(\\d{4}))?' + R, 'giu'), (m, d, mo, y) => {
        const mm = MONTHS[norm(mo)]; let r = mkDate(y ? +y : Y, mm, +d);
        if (r && !y && r > today) r = mkDate(Y - 1, mm, +d); return put(r); }],
      [new RegExp(L + '(?:antes\\s+de\\s+ayer|anteayer|antier|antiayer)' + R, 'giu'), () => put(addDays(today, -2))],

// Ritmo: gasto acumulado día a día vs el mes anterior (a la misma fecha)

// ===== Toasts =====
function toast(html, opts = {}) {
  const t = document.createElement('div'); t.className = 'toast' + (opts.err ? ' err' : ''); t.innerHTML = html;
  $('#toasts').appendChild(t);
  const kill = () => { t.remove(); }; const tm = setTimeout(kill, opts.ms || 7000);
  t.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { clearTimeout(tm); kill(); undo(b.dataset.undo); });
  t.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => { clearTimeout(tm); kill(); openEdit(b.dataset.fix); });
  while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
}

async function undo(id) {

// CSV: fecha,tipo,categoria,monto,descripcion
function parseCsv(txt) {
  txt = txt.replace(/^﻿/, ''); const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < txt.length; i++) { const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { row.push(f); f = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += ch; }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function importCsv(txt) {

  const h = rows[0].map(x => Parser.norm(x).trim()); const ix = k => h.findIndex(x => x.startsWith(k));
  const iF = ix('fecha'), iT = ix('tipo'), iC = ix('categ'), iM = Math.max(ix('monto'), ix('valor')), iD = Math.max(ix('descrip'), ix('nota'));
  if (iF < 0 || iM < 0) { toast('<span>El CSV necesita al menos las columnas fecha y monto.</span>', {err: 1}); return; }
  const now = new Date().toISOString(), out = [];

    let fe = (r[iF] || '').trim(), mt = (r[iM] || '').replace(/[^\d,.\-]/g, '');

    if (!m) continue;
    let n = /,\d{1,2}$/.test(mt) ? +mt.replace(/\./g, '').replace(',', '.') : +mt.replace(/[.,](?=\d{3}(\D|$))/g, '').replace(',', '.');
    if (!n || isNaN(n)) continue;
    let tp = iT >= 0 ? Parser.norm(r[iT]) : ''; tp = /ingreso|entrada|income/.test(tp) ? 'ingreso' : /gasto|egreso|salida|expense/.test(tp) ? 'gasto' : n < 0 ? 'gasto' : 'gasto';
    const cat = (iC >= 0 && r[iC].trim()) || (tp === 'gasto' ? 'Otros' : 'Ingresos varios');
    out.push({id: uid() + out.length, fecha: m, tipo: tp, categoria: cat, monto: Math.abs(Math.round(n)), descripcion: (iD >= 0 ? r[iD] : '').trim() || cat, creado: now});
  }
  if (!out.length) { toast('<span>No encontré movimientos válidos en el archivo.</span>', {err: 1}); return; }
  const ok = await new Promise(res => { openSheet(`<h3>Importar historial</h3><p class="mut" style="line-height:1.5">Encontré <b style="color:var(--tx)">${out.length.toLocaleString('es-CO')}</b> movimientos, desde ${dayLabel(out.map(x => x.fecha).sort()[0])} hasta ${dayLabel(out.map(x => x.fecha).sort().pop())}.</p><button class="btn" id="iY">Importar</button><button class="btn2" id="iN">Cancelar</button>`); $('#iY').onclick = () => res(true); $('#iN').onclick = () => { closeSheet(); res(false); }; });
  if (!ok) return;
  const newCats = [];
  out.forEach(x => { if (!S.cats.some(c => c.nombre === x.categoria && c.tipo === x.tipo) && !newCats.some(c => c.nombre === x.categoria && c.tipo === x.tipo)) newCats.push({nombre: x.categoria, tipo: x.tipo, emoji: '🏷️', color: x.tipo === 'ingreso' ? '#22C55E' : PAL[(S.cats.length + newCats.length) % PAL.length], palabras: ''}); });
  closeSheet(); toast('<span>Importando… no cierres la app.</span>', {ms: 4000});
  try {
    if (newCats.length) { S.cats.push(...newCats); await call('saveCats', S.cats); }
    for (let i = 0; i < out.length; i += 400) await call('importMovs', out.slice(i, i + 400));
    S.movs.push(...out); render(); toast(`<span>Listo: ${out.length} movimientos importados.</span>`, {ms: 5000});
  } catch (e) { toast('<span>La importación se interrumpió. Revisa tu hoja antes de repetirla.</span>', {err: 1}); load(); }
}

function setTheme(k) {
  if (k === 'oscuro') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k;
  try { localStorage.setItem('finanzas_tema', k); } catch (e) {}
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = {oscuro: '#0F172A', claro: '#F1F5F9', crema: '#F6EFE2'}[k];
  render();
}
// ===== Inicio =====
const CK = 'finanzas_cache_v1';
function saveCache() { if (DEMO) return; try { localStorage.setItem(CK, JSON.stringify({movs: S.movs, cats: S.cats, fijos: S.fijos, pres: S.pres, url: S.url})); } catch (e) {} }
function loadCache() { if (DEMO) return false; try { const c = JSON.parse(localStorage.getItem(CK)); if (c && c.cats) { S.movs = c.movs; S.cats = c.cats; S.fijos = c.fijos || []; S.pres = c.pres || []; S.url = c.url; render(); return true; } } catch (e) {} return false; }
function setupScreen() {
  document.querySelector('.bar').style.display = 'none'; document.querySelector('header').style.display = 'none';
  $('#view').innerHTML = `<div style="text-align:center;padding:30px 4px 10px"><img src="icon-192.png" width="88" height="88" style="border-radius:22px" alt=""><h2 style="margin:14px 0 6px">Conecta tu hoja</h2><div class="lbl" style="line-height:1.5">Solo se hace una vez en este celular.</div></div>
  <div class="fld"><label>Dirección de tu hoja (termina en /exec)</label><input class="inp" id="sU" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="fld"><label>Clave</label><input class="inp" id="sK" placeholder="La clave que creaste en Apps Script"></div>
  <div id="sE" class="exp" style="font-size:14px;margin-bottom:10px"></div>
  <button class="btn" id="sB">Conectar</button>`;
  $('#sB').onclick = async () => {
    const url = $('#sU').value.trim(), token = $('#sK').value.trim(); $('#sE').textContent = '';
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { $('#sE').textContent = 'Revisa la dirección: debe empezar por https://script.google.com y terminar en /exec.'; return; }
    if (!token) { $('#sE').textContent = 'Escribe la clave.'; return; }
    $('#sB').textContent = 'Conectando…';
    try {
      const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({token, fn: 'getData'})}).then(r => r.json());
      if (!r.ok) throw new Error(r.error);
      localStorage.setItem('finanzas_api', JSON.stringify({url, token})); location.reload();
    } catch (e) { $('#sB').textContent = 'Conectar'; $('#sE').textContent = /Token/.test(e.message) ? 'La clave no coincide.' : 'No pude conectar. Revisa la dirección y que la implementación diga "Cualquier persona".'; }
  };
}
async function load() {
  if (PWA && !API_URL) return setupScreen();
  const cached = loadCache();
  try { const d = await call('getData'); S.movs = d.movs || []; S.cats = (d.cats && d.cats.length) ? d.cats : DEFAULT_CATS.map(c => ({...c})); S.fijos = d.fijos || []; S.pres = d.presupuestos || []; S.url = d.url || ''; render(); }
  catch (e) { if (cached) { toast('<span>Sin conexión: mostrando tus últimos datos.</span>', {err: 1, ms: 4000}); return; } $('#view').innerHTML = '<div class="empty">No pude cargar tus datos.<br>Revisa tu conexión.<br><br><button class="btn2" onclick="load()">Reintentar</button></div>'; }
}
syncMic(); load();
if (PWA && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); { const k = document.documentElement.dataset.theme; if (k) { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = {claro: '#F1F5F9', crema: '#F6EFE2'}[k]; } }
</script>
</body>
